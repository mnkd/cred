version: 2

builds:
  - env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mnkd/cred/cmd.version={{.Version}}

# Homebrew quarantines cask downloads, so Gatekeeper rejects the binary unless
# it is signed with a Developer ID and notarized. Not gated on isEnvSet: a
# release without the secrets must fail rather than publish a blocked cask.
# Snapshot builds skip notarization.
notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]

homebrew_casks:
  - repository:
      owner: mnkd
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mnkd/cred"
    description: "A CLI tool for managing API keys via macOS Keychain"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
