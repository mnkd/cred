version: 2

builds:
  - env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/mnkd/cred/cmd.version={{.Version}}

archives:
  - format: tar.gz

brews:
  - repository:
      owner: mnkd
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mnkd/cred"
    description: "A CLI tool for managing API keys via macOS Keychain"
    license: "MIT"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
